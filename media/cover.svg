<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
  <title id="t">Plugin Loader</title>
  <desc id="d">The game connects to version.dll through one hook, and version.dll loads the plugin files beside it in alphabetical order.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16293A" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="52%" cy="58%" r="50%">
      <stop offset="0" stop-color="#173B44" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0D1B26" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ground -->
  <rect width="1280" height="720" fill="#0D1B26"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- title -->
  <text x="90" y="112" fill="#EAF1F5" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-1">Plugin Loader</text>
  <text x="92" y="156" fill="#8FA6B8" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="25">One version.dll. Every plugin drops in beside it.</text>

  <!-- traces: the game into the loader, the loader out to each plugin -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M430 418 H566" stroke="#F2A33A" stroke-width="4"/>
    <g stroke="#3FC1B0" stroke-width="3" opacity="0.9">
      <path d="M754 268 H800 V257 H850"/>
      <path d="M754 333 H800 V327 H850"/>
      <path d="M754 398 H850"/>
      <path d="M754 463 H800 V467 H850"/>
      <path d="M754 528 H800 V537 H850"/>
    </g>
  </g>
  <text x="498" y="402" fill="#F2A33A" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">ONE HOOK</text>

  <!-- the game -->
  <g transform="translate(90 362)" filter="url(#lift)">
    <rect width="340" height="112" rx="9" fill="#132637" stroke="#8FA3B4" stroke-width="2"/>
    <text x="22" y="44" fill="#8FA6B8" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">THE GAME</text>
    <text x="22" y="78" fill="#EAF1F5" font-family="'JetBrains Mono',Consolas,monospace" font-size="16">MotorTown-Win64-Shipping</text>
  </g>

  <!-- the loader: a chip with its pins -->
  <g transform="translate(566 232)" filter="url(#lift)">
    <g fill="#3FC1B0">
      <rect x="188" y="30" width="16" height="12" rx="2"/>
      <rect x="188" y="95" width="16" height="12" rx="2"/>
      <rect x="188" y="160" width="16" height="12" rx="2"/>
      <rect x="188" y="225" width="16" height="12" rx="2"/>
      <rect x="188" y="290" width="16" height="12" rx="2"/>
    </g>
    <rect x="-16" y="180" width="16" height="12" rx="2" fill="#F2A33A"/>
    <rect width="188" height="332" rx="12" fill="#10222F" stroke="#3FC1B0" stroke-width="3"/>
    <circle cx="26" cy="26" r="6" fill="#3FC1B0"/>
    <text x="94" y="174" fill="#EAF1F5" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="21" font-weight="700">version.dll</text>
    <text x="94" y="202" fill="#7FB9B0" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="15">the loader</text>
  </g>

  <!-- the plugins, alphabetical -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="15" filter="url(#lift)">
    <g transform="translate(850 232)">
      <rect width="340" height="50" rx="7" fill="#132637" stroke="#2B5560" stroke-width="1.5"/>
      <text x="18" y="31" fill="#D7E2EA">mt_plugin_CapitalistEconomy.dll</text>
    </g>
    <g transform="translate(850 302)">
      <rect width="340" height="50" rx="7" fill="#132637" stroke="#2B5560" stroke-width="1.5"/>
      <text x="18" y="31" fill="#D7E2EA">mt_plugin_CompanySizeUnlimited.dll</text>
    </g>
    <g transform="translate(850 373)">
      <rect width="340" height="50" rx="7" fill="#132637" stroke="#2B5560" stroke-width="1.5"/>
      <text x="18" y="31" fill="#D7E2EA">mt_plugin_SearchBox.dll</text>
    </g>
    <g transform="translate(850 442)">
      <rect width="340" height="50" rx="7" fill="#132637" stroke="#2B5560" stroke-width="1.5"/>
      <text x="18" y="31" fill="#D7E2EA">mt_plugin_SmokeFactory.dll</text>
    </g>
    <g transform="translate(850 512)">
      <rect width="340" height="50" rx="7" fill="#132637" stroke="#2B5560" stroke-width="1.5"/>
      <text x="18" y="31" fill="#D7E2EA">mt_plugin_VehicleParker.dll</text>
    </g>
  </g>
  <text x="1190" y="214" fill="#3FC1B0" text-anchor="end" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">plugins\  ·  LOADED A TO Z</text>

  <!-- the facts -->
  <text x="92" y="664" fill="#8FA6B8" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="19">One hook into the game   ·   plugins load A to Z   ·   settings never overwrite each other   ·   for Motor Town</text>
</svg>
